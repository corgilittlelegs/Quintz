name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.0 or 1.0.0). Leave empty to use commit hash.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history so commit count and tags work automatically

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: get_version
        run: |
          RAW_TAG="${{ github.event.inputs.version || github.ref_name }}"
          # Clean leading 'v' for Android versionName (e.g. v1.0.0 -> 1.0.0)
          VERSION_NAME="${RAW_TAG#v}"
          if [ -z "$VERSION_NAME" ] || [ "$RAW_TAG" = "main" ]; then
            VERSION_NAME=$(git describe --tags --always | sed 's/^v//')
            TAG_NAME="v${VERSION_NAME}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi
          
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Building Quintz with versionName: ${VERSION_NAME}, tag: ${TAG_NAME}"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon -PversionName="${{ steps.get_version.outputs.version_name }}"

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          mkdir -p release_assets
          APK_NAME="Quintz-${{ steps.get_version.outputs.tag_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release_assets/${APK_NAME}"
          echo "apk_path=release_assets/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Artifact (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_asset.outputs.apk_name }}
          path: ${{ steps.prepare_asset.outputs.apk_path }}
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "Quintz ${{ steps.get_version.outputs.tag_name }}"
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
