name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: 'Tag created by Release Please'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to rebuild (e.g. v1.3.0). New versions use the release PR.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: get_version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RAW_TAG="$VERSION_INPUT"
          if [ -n "$RAW_TAG" ]; then
            VERSION_NAME="${RAW_TAG#v}"
            TAG_NAME="v${VERSION_NAME}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION_NAME="${RAW_TAG#v}"
            TAG_NAME="v${VERSION_NAME}"
          else
            echo "A version is required for a manual release." >&2
            exit 1
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be three numeric components (for example, v1.2.9)." >&2
            exit 1
          fi

          # v1.2.10 shipped with versionCode 10210. Count later release tags
          # on this release line so Android's update code is independent of SemVer.
          BASE_TAG=v1.2.10
          BASE_CODE=10210
          RELEASE_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$BASE_TAG" "$RELEASE_SHA"; then
            echo "$BASE_TAG must be an ancestor of the release commit." >&2
            exit 1
          fi
          RELEASES_SINCE_BASE=0
          while IFS= read -r CANDIDATE_TAG; do
            if [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
               [[ "$CANDIDATE_TAG" != "$BASE_TAG" ]] &&
               git merge-base --is-ancestor "$BASE_TAG" "$CANDIDATE_TAG^{commit}" &&
               git merge-base --is-ancestor "$CANDIDATE_TAG^{commit}" "$RELEASE_SHA"; then
              RELEASES_SINCE_BASE=$((RELEASES_SINCE_BASE + 1))
            fi
          done < <(git tag --list 'v*')
          VERSION_CODE=$((BASE_CODE + RELEASES_SINCE_BASE))
          if (( VERSION_CODE <= BASE_CODE || VERSION_CODE > 2100000000 )); then
            echo "Invalid Android versionCode: $VERSION_CODE" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$TAG_NAME^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "$TAG_NAME does not point to the release commit." >&2
            exit 1
          fi
          LATEST_TAG=$(git tag --sort=-version:refname --list 'v[0-9]*' | sed -n '1p')
          if [[ "$LATEST_TAG" != "$TAG_NAME" ]]; then
            echo "$TAG_NAME is not the latest version tag ($LATEST_TAG)." >&2
            exit 1
          fi
          PREVIOUS_TAG=$(git tag --sort=-version:refname --list 'v[0-9]*' | sed -n '2p')
          if [[ -n "$PREVIOUS_TAG" ]] && ! git merge-base --is-ancestor "$PREVIOUS_TAG" "$RELEASE_SHA"; then
            echo "Release commit must descend from the previous version tag ($PREVIOUS_TAG)." >&2
            exit 1
          fi
          if [[ -n "$PREVIOUS_TAG" && "$(git rev-parse "$PREVIOUS_TAG^{commit}")" == "$RELEASE_SHA" ]]; then
            echo "A new release needs a newer commit than $PREVIOUS_TAG." >&2
            exit 1
          fi

          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "commit_sha=${RELEASE_SHA}" >> $GITHUB_OUTPUT
          echo "Resolved version_name: ${VERSION_NAME}, version_code: ${VERSION_CODE}, tag_name: ${TAG_NAME}"

      - name: Unit tests and full lint
        run: ./gradlew test lintDebug lintRelease --no-daemon --console=plain

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ steps.get_version.outputs.version_name }}" \
            -PversionCode="${{ steps.get_version.outputs.version_code }}"

      - name: Sign with rotated release key
        shell: bash
        env:
          LEGACY_KEYSTORE_BASE64: ${{ secrets.LEGACY_KEYSTORE_BASE64 }}
          LEGACY_KEY_ALIAS: ${{ secrets.LEGACY_KEY_ALIAS }}
          LEGACY_KEYSTORE_PASSWORD: ${{ secrets.LEGACY_KEYSTORE_PASSWORD }}
          LEGACY_KEY_PASSWORD: ${{ secrets.LEGACY_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          : "${LEGACY_KEYSTORE_BASE64:?Missing legacy signing key secret}"
          : "${RELEASE_KEYSTORE_BASE64:?Missing rotated signing key secret}"
          : "${SIGNING_LINEAGE_BASE64:?Missing signing lineage secret}"
          LEGACY_KEYSTORE="$RUNNER_TEMP/legacy-release.jks"
          RELEASE_KEYSTORE="$RUNNER_TEMP/rotated-release.jks"
          SIGNING_LINEAGE="$RUNNER_TEMP/signing-lineage.bin"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          export LEGACY_KEYSTORE RELEASE_KEYSTORE SIGNING_LINEAGE APKSIGNER
          printf '%s' "$LEGACY_KEYSTORE_BASE64" | base64 --decode > "$LEGACY_KEYSTORE"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"
          printf '%s' "$SIGNING_LINEAGE_BASE64" | base64 --decode > "$SIGNING_LINEAGE"
          bash scripts/sign-release.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK Asset & Checksum
        id: prepare_asset
        run: |
          mkdir -p release_assets
          APK_NAME="Quintz-${{ steps.get_version.outputs.tag_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release_assets/${APK_NAME}"
          sha256sum "release_assets/${APK_NAME}" > "release_assets/${APK_NAME}.sha256"
          
          echo "apk_path=release_assets/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "checksum_path=release_assets/${APK_NAME}.sha256" >> $GITHUB_OUTPUT
          echo "sha256=$(cut -d ' ' -f 1 "release_assets/${APK_NAME}.sha256")" >> $GITHUB_OUTPUT

      - name: Upload Artifact (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_asset.outputs.apk_name }}
          path: release_assets/
          retention-days: 14

      - name: Generate Changelog & Release Notes
        id: release_notes
        env:
          TAG_NAME: ${{ steps.get_version.outputs.tag_name }}
          APK_NAME: ${{ steps.prepare_asset.outputs.apk_name }}
          APK_SHA256: ${{ steps.prepare_asset.outputs.sha256 }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          NOTES_PATH="release-notes.md"
          
          # Find the previous release tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || git tag --sort=-version:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)
          
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
          else
            COMMIT_RANGE="HEAD"
          fi

          append_section() {
            local title="$1"
            local pattern="$2"
            local entries
            entries=$(git log "$COMMIT_RANGE" --extended-regexp --grep="$pattern" \
              --pretty=format:"- %s ([%h]($REPOSITORY_URL/commit/%H))" || true)
            if [ -n "$entries" ]; then
              printf '\n### %s\n\n%s\n' "$title" "$entries" >> "$NOTES_PATH"
            fi
          }

          {
            printf '# Quintz %s\n' "$TAG_NAME"
            if [ -n "$PREVIOUS_TAG" ]; then
              printf '\n*Changes since [%s](%s/compare/%s...%s)*\n' "$PREVIOUS_TAG" "$REPOSITORY_URL" "$PREVIOUS_TAG" "$TAG_NAME"
            fi
          } > "$NOTES_PATH"

          append_section '🚀 New Features' '^feat'
          append_section '🐛 Bug Fixes' '^fix'
          append_section '⚡ Improvements & Refactoring' '^(refactor|perf)'
          append_section '🛠️ Maintenance & CI' '^(ci|chore|build|docs|test)'

          # Fallback if none of the conventional commit prefixes matched
          if ! grep -q '^### ' "$NOTES_PATH"; then
            printf '\n### 📝 Commits\n\n' >> "$NOTES_PATH"
            git log "$COMMIT_RANGE" --pretty=format:"- %s ([%h]($REPOSITORY_URL/commit/%H))" >> "$NOTES_PATH" || true
            printf '\n' >> "$NOTES_PATH"
          fi

          {
            printf '\n---\n\n'
            printf '### 📦 Installation & Verification\n\n'
            printf '1. Download `%s` below.\n' "$APK_NAME"
            printf '2. Install it on Android 10 or later.\n'
            printf '3. Launch Shizuku and grant Quintz permission when prompted.\n\n'
            printf '**SHA-256 Checksum:**\n```\n%s\n```\n' "$APK_SHA256"
            printf '*(The matching `.sha256` checksum file is also attached below)*\n'
          } >> "$NOTES_PATH"

          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          target_commitish: ${{ steps.get_version.outputs.commit_sha }}
          name: "Quintz ${{ steps.get_version.outputs.tag_name }}"
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            ${{ steps.prepare_asset.outputs.apk_path }}
            ${{ steps.prepare_asset.outputs.checksum_path }}
          draft: false
          prerelease: false
