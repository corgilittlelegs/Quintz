name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: get_version
        run: |
          RAW_TAG="${{ github.event.inputs.version }}"
          if [ -z "$RAW_TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              RAW_TAG="${{ github.ref_name }}"
            else
              RAW_TAG="v1.0.0"
            fi
          fi
          
          # Strip leading 'v' for Android versionName (e.g. v1.0.0 -> 1.0.0)
          VERSION_NAME="${RAW_TAG#v}"
          TAG_NAME="v${VERSION_NAME}"
          
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Resolved version_name: ${VERSION_NAME}, tag_name: ${TAG_NAME}"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon -PversionName="${{ steps.get_version.outputs.version_name }}"

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          mkdir -p release_assets
          APK_NAME="Quintz-${{ steps.get_version.outputs.tag_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release_assets/${APK_NAME}"
          echo "apk_path=release_assets/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Artifact (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_asset.outputs.apk_name }}
          path: ${{ steps.prepare_asset.outputs.apk_path }}
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Quintz ${{ steps.get_version.outputs.tag_name }}"
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
